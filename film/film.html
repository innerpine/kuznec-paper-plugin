<script>
'use strict';
// ───────────────────────────── time ─────────────────────────────
// 120 BPM, 54 beats. Everything below is a pure function of t (seconds).
const BPM = 120, BEAT = 60 / BPM, BEATS = 54, DUR = BEATS * BEAT;
const B = (n) => (n - 1) * BEAT;                       // start of beat n (1-based)
const W = 1440, H = 1440, CX = 720, CY = 720;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const smooth = (u) => u * u * (3 - 2 * u);
const eio = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);   // ease in-out cubic
const eo = (u) => 1 - Math.pow(1 - u, 3);
const ei = (u) => u * u * u;
const eio4 = (u) => (u < 0.5 ? 8 * u ** 4 : 1 - Math.pow(-2 * u + 2, 4) / 2);
const eoExpo = (u) => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u));
const tw = (t, t0, t1, ease = eio) => ease(inv(t0, t1, t));
const on = (t, a, b) => t >= a && t < b;

// Closed-form step response of a damped spring. period ≈ time of one oscillation.
function spring(dt, period = 0.42, zeta = 0.62) {
  if (dt <= 0) return 0;
  const w = (2 * Math.PI) / period;
  if (zeta >= 1) return 1 - Math.exp(-w * dt) * (1 + w * dt);
  const wd = w * Math.sqrt(1 - zeta * zeta);
  return 1 - Math.exp(-zeta * w * dt) * (Math.cos(wd * dt) + ((zeta * w) / wd) * Math.sin(wd * dt));
}
// A value with several targets: one spring per change, summed.
// keys: [[t, value, period?, zeta?], ...]
function track(t, v0, keys) {
  let v = v0, prev = v0;
  for (const k of keys) { v += (k[1] - prev) * spring(t - k[0], k[2], k[3]); prev = k[1]; }
  return v;
}
// Same, but each change eases over a fixed duration instead of springing: [[t0, t1, value, ease?], ...]
function path(t, v0, keys) {
  let v = v0, prev = v0;
  for (const k of keys) { v += (k[2] - prev) * (k[3] || eio)(inv(k[0], k[1], t)); prev = k[2]; }
  return v;
}
const pop = (t, t0, period = 0.36, zeta = 0.5) => track(t, 0, [[t0, 1, period, zeta]]);   // spring up from zero

// ───────────────────────────── dom helpers ─────────────────────────────
const stage = document.getElementById('stage');
const defs = document.querySelector('#defs defs');
const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, cls, parent, css) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (css) Object.assign(e.style, css);
  if (parent) parent.appendChild(e);
  return e;
}
function svg(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const px = (v) => `${v.toFixed(3)}px`;
// Place an element by its box in world units. Children of a visible element use visibility: inherit.
function box(e, x, y, w, h, extra) {
  const s = e.style;
  s.left = px(x); s.top = px(y); s.width = px(Math.max(0, w)); s.height = px(Math.max(0, h));
  if (extra) Object.assign(s, extra);
}
function show(e, v) { e.style.visibility = v ? 'inherit' : 'hidden'; }
function canvas(w, h, parent, cls = 'abs') {
  const c = el('canvas', cls, parent);
  c.width = w; c.height = h;
  return c;
}
function rrPath(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// object-fit: cover for a square or rectangular source into (x, y, w, h)
function drawCover(ctx, img, x, y, w, h, zoom = 1, fx = 0.5, fy = 0.5) {
  const iw = img.naturalWidth || img.videoWidth || img.width, ih = img.naturalHeight || img.videoHeight || img.height;
  const sc = Math.max(w / iw, h / ih) * zoom;
  const sw = w / sc, sh = h / sc;
  ctx.drawImage(img, (iw - sw) * fx, (ih - sh) * fy, sw, sh, x, y, w, h);
}

// ───────────────────────────── assets ─────────────────────────────
const UPGRADES = {
  vampirism: { name: 'Вампиризм', price: 40000, item: 'Меч', lore: 'Шанс восстановить часть здоровья при ударе по врагу.' },
  flame:     { name: 'Пламенное лезвие', price: 32000, item: 'Меч', lore: 'Шанс поджечь цель при ударе.' },
  poison:    { name: 'Ядовитый порез', price: 33000, item: 'Меч', lore: 'Шанс отравить цель после удара.' },
  nighteye:  { name: 'Ночной глаз', price: 18000, item: 'Шлем', lore: 'Ночное зрение, пока шлем надет.' },
  shield:    { name: 'Магический щит', price: 34000, item: 'Шлем', lore: 'Снижает магический урон.' },
  laststand: { name: 'Последний рубеж', price: 55000, item: 'Нагрудник', lore: 'Защита, когда здоровья мало.' },
  wind:      { name: 'Шаг ветра', price: 28000, item: 'Поножи', lore: 'Скорость передвижения.' },
  feather:   { name: 'Пероход', price: 18000, item: 'Ботинки', lore: 'Меньше урона от падения.' },
  rabbit:    { name: 'Кроличий прыжок', price: 21000, item: 'Ботинки', lore: 'Прыжки выше.' },
};
const money = (n) => n.toLocaleString('ru-RU').replace(/ /g, ' ');
const IMG = {};
function loadImage(name, src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => { IMG[name] = i; res(i); }; i.onerror = rej; i.src = src; });
}

// ───────────────────────────── camera + cursor ─────────────────────────────
// World → screen: screen = (p - cam) * s + centre.
function camTransform(world, cam) {
  world.style.transform = `translate(${(CX - cam.x * cam.s).toFixed(3)}px, ${(CY - cam.y * cam.s).toFixed(3)}px) scale(${cam.s.toFixed(5)})`;
}
const toScreen = (cam, x, y) => [(x - cam.x) * cam.s + CX, (y - cam.y) * cam.s + CY];

const cursorEl = (() => {
  const s = svg('svg', { id: 'cursor', viewBox: '0 0 32 32' });
  // macOS-style arrow: black body, white keyline. Tip at (6, 3).
  svg('path', { d: 'M6 3 L6 25.5 L11.6 20.4 L15.4 29 L19.6 27.2 L15.8 18.8 L23.4 18.6 Z', fill: '#0b0b0c', stroke: '#fff', 'stroke-width': '2', 'stroke-linejoin': 'round' }, s);
  stage.appendChild(s);
  return s;
})();
// c = { x, y (screen px), size (px), press 0..1, visible }
function drawCursor(c) {
  if (!c || !c.visible) { cursorEl.style.visibility = 'hidden'; return; }
  cursorEl.style.visibility = 'visible';
  const k = c.size / 32 * (1 - 0.16 * clamp(c.press || 0, 0, 1.5));
  // keep the tip anchored while scaling
  cursorEl.style.transform = `translate(${(c.x - 6 * k).toFixed(2)}px, ${(c.y - 3 * k).toFixed(2)}px) scale(${k.toFixed(4)})`;
}
// press envelope for a click at t0: down fast, release with a spring
const press = (t, t0, hold = 0.07) => (t < t0 ? 0 : t < t0 + hold ? eo(inv(t0, t0 + 0.05, t)) : 1 - spring(t - t0 - hold, 0.22, 0.6));
// cursor position along keyed moves: keys [[t0, t1, x, y], ...] from (x0, y0)
function cursorPath(t, x0, y0, keys) {
  return [path(t, x0, keys.map((k) => [k[0], k[1], k[2], k[4]])), path(t, y0, keys.map((k) => [k[0], k[1], k[3], k[4]]))];
}

// ───────────────────────────── acts ─────────────────────────────
const ACTS = [];
function act(name, t0, t1) {
  const root = el('div', 'act', stage);
  root.dataset.act = name;
  const a = { name, t0, t1, root, update: null };
  ACTS.push(a);
  return a;
}

<script>
'use strict';
// ═════════════════════════════ LIQUID GLASS ═════════════════════════════
// Every glass element holds its own clone of the scene behind it (a canvas we redraw each
// frame from the same sources), filtered by an SVG feImage displacement map run through three
// feDisplacementMaps at slightly different scales (R, G, B → chromatic edges), plus a rim light.

const mapCache = new Map();
// Rounded-rect distance field → displacement map. Margin m stays neutral (128, 128).
// Near the edge the vector points outward, so the rim samples the scene just outside it.
function rrMapURL(w, h, r, bevel, m) {
  w = Math.max(2, Math.round(w)); h = Math.max(2, Math.round(h)); r = Math.round(Math.min(r, w / 2, h / 2));
  bevel = Math.max(1, Math.round(bevel)); m = Math.round(m);
  const key = `${w}|${h}|${r}|${bevel}|${m}`;
  if (mapCache.has(key)) return mapCache.get(key);
  const cw = w + 2 * m, ch = h + 2 * m;
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const g = c.getContext('2d');
  const img = g.createImageData(cw, ch), d = img.data;
  const hx = w / 2 - r, hy = h / 2 - r;
  for (let j = 0; j < ch; j++) {

    const dx = Math.cos(th + (2 * Math.PI) / 3), dy = Math.sin(th + (2 * Math.PI) / 3);
    // line p + s·d meets the rim circle at s = −(m·d) ± sqrt(R² − |m|² + (m·d)²), m = p − c
    const mx = p[0] - cx, my = p[1] - cy, md = mx * dx + my * dy;
    const disc = Math.sqrt(Math.max(0, R * R - (mx * mx + my * my) + md * md));
    const e1 = [p[0] + (-md + disc) * dx, p[1] + (-md + disc) * dy];   // extension beyond q
    const e0 = [p[0] + (-md - disc) * dx, p[1] + (-md - disc) * dy];   // extension behind p
    const a1 = Math.atan2(e1[1] - cy, e1[0] - cx), a0 = Math.atan2(e0[1] - cy, e0[0] - cx);
    // the SHORT arc from e1 back to e0 (the side away from the aperture)
    let sweep = a0 - a1;
    while (sweep <= -Math.PI) sweep += 2 * Math.PI;
    while (sweep > Math.PI) sweep -= 2 * Math.PI;
    if (a < 0.5) sweep = -Math.PI;                                   // closed: each blade is a half disc
    ctx.beginPath();
    ctx.moveTo(e0[0], e0[1]);
    ctx.lineTo(p[0], p[1]);
    ctx.lineTo(q[0], q[1]);
    ctx.lineTo(e1[0], e1[1]);
    ctx.arc(cx, cy, R, a1, a1 + sweep, sweep < 0);
    ctx.closePath();
    ctx.fillStyle = fills[i % fills.length]; ctx.fill();
    // seam along the blade's leading edge
    ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(e1[0], e1[1]);
    ctx.strokeStyle = edge; ctx.lineWidth = lw; ctx.stroke();
  }
}

// Positions of the 3×3 map
const gridRect = (g) => [CX + g[0] * CELL - GRID.tile / 2, CY + g[1] * CELL - GRID.tile / 2, GRID.tile, GRID.tile];

OPEN.update = (t) => {
  // camera: still until the click on the hero, then zoom to land on the drop at B(13)
  const z = t >= B(53) ? 0 : tw(t, B(12) + 0.04, B(13), eio4);
  const heroCx = HERO[0] + HERO[2] / 2, heroCy = HERO[1] + HERO[3] / 2;
  const cam = { x: lerp(CX, heroCx, z), y: lerp(CY, heroCy, z), s: 1 / lerp(1, HERO[2] / W, z) };
  // ^ scale interpolated in "visible width" so the push feels linear on screen
  camTransform(openWorld, cam);

  // ── wordmark / dot / pill / iris ──
  const k = wordmarkK(t);
  const dot = layoutWordmark(k);
  const endPhase = t >= B(53);                      // the ending reuses pill → dot → letters
  let bx = dot.x, by = dot.y, bw = dot.w, bh = dot.h, br = 3;
  let label = 0, irisA = 0, irisRot = 0, irisOn = false, coverIn = false;
  const PILL = { w: 430, h: 134 };
  if (!endPhase) {
    // beat 2: dot expands into the pill
    const p = track(t, 0, [[B(2), 1, 0.46, 0.72]]);
    bw = lerp(dot.w, PILL.w, p); bh = lerp(dot.h, PILL.h, p);
    bx = lerp(dot.x, CX - PILL.w / 2, p); by = lerp(dot.y, CY - PILL.h / 2, p);
    br = lerp(3, PILL.h / 2, clamp(p * 1.4));
    // beat 3: label rises inside the pill
    label = track(t, 0, [[B(3), 1, 0.4, 0.78]]);
    // beat 4: click → pill becomes a circle while the blades close over the label
    const c = track(t, 0, [[B(4) + 0.04, 1, 0.42, 0.7]]);
    const d1 = 300, d2 = 600;
    // beat 5: snap open onto the first cover, circle grows
    const g = track(t, 0, [[B(5), 1, 0.5, 0.62]]);
    const D = lerp(d1, d2, g);
    bw = lerp(bw, D, c); bh = lerp(bh, D, c);
    br = lerp(br, D / 2, c);
    bx = lerp(bx, CX - D / 2, c); by = lerp(by, CY - D / 2, c);
    irisOn = t >= B(4) + 0.02 && t < B(5) + 0.4;
    irisA = t < B(5) ? lerp(1, 0, tw(t, B(4) + 0.04, B(4) + 0.36, eio)) : tw(t, B(5) - 0.0, B(5) + 0.26, eo);
    irisRot = (t < B(5) ? lerp(0, 0.95, tw(t, B(4) + 0.04, B(4) + 0.36, eio)) : 0.95 + 0.9 * tw(t, B(5), B(5) + 0.26, eo));
    coverIn = t >= B(5);
  } else {
    // ending: black screen contracts into the pill, then the dot; letters spring out on the last beat
    const p = 1 - track(t, 0, [[B(53) + 0.2, 1, 0.42, 0.85]]);       // pill → dot
    bw = lerp(dot.w, PILL.w, p); bh = lerp(dot.h, PILL.h, p);
    bx = lerp(dot.x, CX - PILL.w / 2, p); by = lerp(dot.y, CY - PILL.h / 2, p);
    br = lerp(3, PILL.h / 2, clamp(p * 1.4));
    const f = 1 - tw(t, B(53), B(53) + 0.24, eio);                     // full frame → pill
    bx = lerp(bx, 0, f); by = lerp(by, 0, f); bw = lerp(bw, W, f); bh = lerp(bh, H, f); br = lerp(br, 0, f);
    // the camera is reset to identity in the ending
  }

  // the dot element is the shape: dot → pill → circle → tile (the tile is drawn by the hero tile itself)
  const tileStart = B(6);
  const showDot = t < tileStart || endPhase;
  show(wmDot, showDot);
  box(wmDot, bx, by, bw, bh, { borderRadius: px(br) });
  // label sits centred; it rises from behind the pill's own edge
  const lw = 216;
  box(pillLabel, bw / 2 - lw / 2, bh / 2 - 28 + (1 - label) * 90, lw, 56);
  show(pillLabelMask, !coverIn && !endPhase);
  // iris canvas covers the shape; blades in canvas pixels (720 = shape size)
  show(irisCanvas, irisOn || coverIn);
  if (irisOn || coverIn) {
    const ctx = irisCanvas.getContext('2d');
    ctx.clearRect(0, 0, 720, 720);
    if (coverIn) drawCover(ctx, IMG.vampirism, 0, 0, 720, 720);
    const R = 360 * Math.SQRT2 + 4;
    const amax = R * 1.02;
    if (irisOn && irisA < 0.999) drawIris(ctx, 360, 360, R, irisA * amax, irisRot);
  }

  // ── tiles ──
  const hero = tileEls[0];
  tileEls.forEach((T, i) => {
    const tile = T.tile;
    let [x, y, w, h] = gridRect(tile.g);
    let r = 36, sx = 1, sy = 1, ox = 0, oy = 0, vis = t >= tileStart && !endPhase;
    if (i === 0) {
      // hero: grows out of the circle at beat 6 (circle → square tile and shrinks)
      const q = track(t, 0, [[tileStart, 1, 0.5, 0.74]]);
      const D = 600;
      w = h = lerp(D, GRID.tile, q);
      x = CX - w / 2; y = CY - h / 2;
      r = lerp(D / 2, 36, clamp(q * 1.15));
    } else {
      // unfold like a paper map from the shared edge: plus at beat 7, corners at beat 8
      const t0 = tile.from === 'C' ? B(7) + (tile.order - 1) * 0.055 : B(8) + (tile.order - 5) * 0.055;
      const u = track(t, 0, [[t0, 1, 0.5, 0.8]]);
      vis = vis && t >= t0;
      if (tile.axis === 'y') { sy = u; oy = tile.g[1] < 0 ? h : 0; }
      else { sx = u; ox = tile.g[0] < 0 ? w : 0; }
    }
    // beat 10: rearrange into the bento
    const bq = track(t, 0, [[B(10) + tile.order * 0.03, 1, 0.55, 0.72]]);
    const [bxr, byr, bwr, bhr] = benteRect(tile.b);
    x = lerp(x, bxr, bq); y = lerp(y, byr, bq); w = lerp(w, bwr, bq); h = lerp(h, bhr, bq);
    // beat 11: hover lift on the hero; beat 12: press; the zoom then flattens its corners
    if (i === 0) {
      const lift = track(t, 0, [[B(11) + 0.2, 1, 0.4, 0.6], [B(12), 0, 0.3, 0.7]]);
      const s = 1 + 0.025 * lift - 0.012 * press(t, B(12));
      x -= (w * (s - 1)) / 2; y -= (h * (s - 1)) / 2; w *= s; h *= s;
      r = lerp(r, 0, tw(t, B(12) + 0.04, B(13), eio4));
    }
    show(T.root, vis);
    T.root.style.zIndex = i === 0 ? '2' : '1';          // the hero stays on top while the others rearrange
    box(T.root, x, y, w, h, {
      borderRadius: px(r),
      transformOrigin: `${px(ox)} ${px(oy)}`,
      transform: `scale(${Math.max(sx, 1e-3).toFixed(5)}, ${Math.max(sy, 1e-3).toFixed(5)})`,
    });
    // beat 9: names rise, price chips spring up
    const ti = B(9) + tile.order * 0.035;
    // the click on the hero sends names below their mask line and chips back to zero
    const out = tw(t, B(12) + 0.02, B(12) + 0.3, ei);
    const nr = track(t, 0, [[ti, 1, 0.4, 0.8]]) - out;
    T.name.style.transform = `translateY(${px((1 - nr) * 40)})`;
    const cp = pop(t, ti + 0.06, 0.38, 0.52) * (1 - tw(t, B(12), B(12) + 0.22, eio));
    updateGlassChip(T.chip, w, h, cp, IMG[tile.key]);
  });

  // ── cursor ──
  let cur = null;
  if (t >= B(3) && t < B(6)) {
    const [x, y] = cursorPath(t, 1560, 1600, [[B(3), B(4) - 0.08, 880, 770, eio]]);
    const leave = cursorPath(t, 0, 0, [[B(5) + 0.1, B(6) - 0.02, 820, 900, eio]]);
    cur = { x: x + leave[0], y: y + leave[1], size: 46, press: press(t, B(4)), visible: true };
  } else if (t >= B(10) + 0.3 && t < B(13)) {
    const [x, y] = cursorPath(t, 1500, 1620, [[B(10) + 0.3, B(11) + 0.3, 905, 640, eio]]);
    const [sx, sy] = toScreen(cam, x, y);
    cur = { x: sx, y: sy, size: 46 * cam.s, press: press(t, B(12)), visible: true };
  }
  return { cursor: cur };
};
</script>

// mosaic computed from the same image: block size b (1 = full detail)
function paintBg(block) {
  const ctx = bgCanvas.getContext('2d');
  if (block <= 1) { ctx.imageSmoothingEnabled = true; ctx.drawImage(IMG[COVER1], 0, 0, W, H); return; }
  const n = Math.max(1, Math.round(W / block));
  smallCanvas.width = n; smallCanvas.height = n;
  const sc = smallCanvas.getContext('2d');
  sc.imageSmoothingEnabled = true; sc.imageSmoothingQuality = 'high';
  sc.drawImage(IMG[COVER1], 0, 0, n, n);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(smallCanvas, 0, 0, n, n, 0, 0, W, H);
  ctx.imageSmoothingEnabled = true;
}
const drawBgClone = (ctx, gx, gy) => ctx.drawImage(bgCanvas, -gx, -gy);
// Slider → mosaic block size. Seven steps (one per tick); each step resizes the blocks over
// ~3 frames through intermediate sizes instead of jumping in one.
const MOSAIC = [96, 64, 40, 24, 12, 6, 3, 1], MOSAIC_STEPS = 7.5;
function mosaicBlock(p) {
  const kf = p * MOSAIC_STEPS, k = Math.min(7, Math.floor(kf));
  if (k === 0) return MOSAIC[0];
  const win = (0.05 / (SLIDER_T1 - SLIDER_T0)) * MOSAIC_STEPS;   // 50 ms in level units
  const u = smooth(clamp((kf - k) / win));
  return Math.max(1, Math.round(Math.exp(lerp(Math.log(MOSAIC[k - 1]), Math.log(MOSAIC[k]), u))));
}
// lock-screen geometry while the orb grows into it (g: 0 = orb, 1 = screen)
const ORB = { cx: 720, cy: 640, r: 280 };
function screenRect(g) {
  return {
    x: lerp(ORB.cx - ORB.r, SCR.x, g), y: lerp(ORB.cy - ORB.r, SCR.y, g),
    w: lerp(2 * ORB.r, SCR.w, g), h: lerp(2 * ORB.r, SCR.h, g),
    r: lerp(ORB.r, SCR.r, smooth(clamp(g * 1.25))),
  };
}
// where the portrait wallpaper is drawn, given the square its centre occupies
const wallFromSquare = (x, y, s) => ({ x, y: y - s * WALL_OY, w: s, h: s * WALL_K });
function wallRect(g) {
  const a = [ORB.cx - ORB.r, ORB.cy - ORB.r, 2 * ORB.r], b = [SCR.x, SCR.y + (SCR.h - SCR.w) / 2, SCR.w];
  return wallFromSquare(lerp(a[0], b[0], g), lerp(a[1], b[1], g), lerp(a[2], b[2], g));
}
function drawWall(ctx, gx, gy, g = 1) {
  const r = screenRect(g), wr = wallRect(g);
  ctx.save();
  ctx.translate(-gx, -gy);
  rrPath(ctx, r.x, r.y, r.w, r.h, r.r); ctx.clip();
  ctx.drawImage(IMG.wall, wr.x, wr.y, wr.w, wr.h);
  ctx.restore();
}

  }
  // header image grows out of slot 20, then becomes the plan card's image
  const hd = track(t, 0, [[B(35), 1, 0.55, 0.78]]);
  const sc2 = track(t, 0, [[B(36), 1, 0.55, 0.85]]);               // scroll → card
  const HEAD = { x: 200, y: 300, w: 2067, h: 820, r: 48 };
  const CARD_IMG = { x: 260, y: 300, w: 1947, h: 520, r: 36 };

    let R = { x: lerp(r0.x, HEAD.x, hd), y: lerp(r0.y, HEAD.y, hd), w: lerp(r0.w, HEAD.w, hd), h: lerp(r0.h, HEAD.h, hd), r: lerp(r0.r, HEAD.r, clamp(hd)) };

    box(headImg, R.x, R.y, R.w, R.h, { borderRadius: px(R.r) });
    // border and price row grow from the image's edge
    const bd = tw(t, B(36) + 0.05, B(36) + 0.4, eo);
    const pad = 60 * bd, rowH = 360 * tw(t, B(36) + 0.12, B(36) + 0.5, eo);

    box(cardBorder, R.x - pad, R.y - pad, R.w + 2 * pad, R.h + 2 * pad + rowH, { borderRadius: px(R.r + pad) });

    const nm = track(t, 0, [[B(35) + 0.1, 1, 0.42, 0.82]]);

    const ny = lerp(HEAD.y + HEAD.h + 70, CARD_IMG.y + CARD_IMG.h + 70, sc2);

    // each label rises in and leaves upward behind its own mask as the shape morphs
    const texts = [
      `Списано · ${money(BUY.price)}`, `Куём · ${Math.round(100 * tw(t, B(44) + 0.05, B(45) - 0.04, eio))}%`, 'Наносим на предмет', 'Готово',
    ];

    });

<script>
'use strict';
// ═════════════════════════════ DESK ═════════════════════════════
// Black holds a beat, then shrinks into the phone's screen in the desk footage. The same iris
// opens onto the message and closes again; the screen fills the frame for the return.
// Footage is all-intra (every frame a keyframe), loaded as a blob URL, and every frame
// waits for "seeked" before it is drawn.
const FOOTAGE = { src: 'assets/footage/desk-standin.webm', quad: 'assets/footage/desk-standin.quad.json', zoom: 1.62, push: 0.12 };
const DESK = act('desk', B(48), B(53));
const deskCanvas = canvas(W, H, DESK.root);
const deskVideo = document.createElement('video');
deskVideo.muted = true; deskVideo.playsInline = true; deskVideo.preload = 'auto';
let QUAD = null;
DESK.init = async () => {
  const [blob, quad] = await Promise.all([fetch(FOOTAGE.src).then((r) => r.blob()), fetch(FOOTAGE.quad).then((r) => r.json())]);
  QUAD = quad;
  const ready = new Promise((res, rej) => {
    deskVideo.addEventListener('loadeddata', res, { once: true });
    deskVideo.addEventListener('error', () => rej(new Error(`footage failed to load: ${FOOTAGE.src}`)), { once: true });
  });
  deskVideo.src = URL.createObjectURL(blob);
  await ready;
};
async function footageAt(ft) {
  ft = clamp(ft, 0, deskVideo.duration - 0.001);
  if (deskVideo.readyState >= 2 && Math.abs(deskVideo.currentTime - ft) < 1e-6) return;
  await new Promise((r) => { deskVideo.addEventListener('seeked', r, { once: true }); deskVideo.currentTime = ft; });
}
// Minecraft chat colours from messages.yml: &a green, &6 gold
const MC = { a: '#55FF55', g: '#FFAA00', w: '#FFFFFF', gray: '#AAAAAA' };
const INK = '#0B0B0C';
const MESSAGE = [[MC.a, 'Улучшение '], [MC.g, BUY.name], [MC.a, ' куплено за '], [MC.g, `${money(BUY.price)} монет`], [MC.a, '.']];
function wrapRuns(ctx, runs, maxW) {
  // split coloured runs into words, then lay them out in lines
  const words = [];
  for (const [c, txt] of runs) txt.split(/(\s+)/).forEach((w) => w && words.push([c, w]));
  const lines = [[]]; let x = 0;
  for (const [c, w] of words) {
    const ww = ctx.measureText(w).width;
    if (x + ww > maxW && w.trim()) { lines.push([]); x = 0; }
    if (!w.trim() && x === 0) continue;
    lines[lines.length - 1].push([c, w, x]); x += ww;
  }
  return lines;
}
function drawMessage(ctx, w, h) {
  ctx.fillStyle = INK; ctx.fillRect(-w / 2, -h / 2, w, h);
  const u = w / 600;                                          // layout unit: design at 600 px wide
  ctx.save(); ctx.scale(u, u);
  const W2 = w / u, H2 = h / u;
  // sender row
  const ay = -H2 * 0.2;
  ctx.save(); ctx.beginPath(); ctx.arc(-W2 / 2 + 80, ay, 34, 0, Math.PI * 2); ctx.clip();
  ctx.drawImage(IMG.anvil, -W2 / 2 + 46, ay - 34, 68, 68); ctx.restore();
  ctx.fillStyle = '#fff'; ctx.font = '700 34px Geist'; ctx.textBaseline = 'middle';
  ctx.fillText('Кузнец', -W2 / 2 + 132, ay - 12);
  ctx.fillStyle = '#8e8e93'; ctx.font = '500 26px Geist'; ctx.fillText('сейчас · сервер', -W2 / 2 + 132, ay + 22);
  // bubble with the purchase-success message
  ctx.font = '600 34px Geist';
  const lines = wrapRuns(ctx, MESSAGE, W2 - 150);
  const bx = -W2 / 2 + 46, by = ay + 66, bw = W2 - 92, bh = lines.length * 48 + 52;
  rrPath(ctx, bx, by, bw, bh, 30); ctx.fillStyle = '#1c1c1e'; ctx.fill();
  lines.forEach((ln, i) => ln.forEach(([c, word, x]) => { ctx.fillStyle = c; ctx.fillText(word, bx + 30 + x, by + 50 + i * 48); }));
  // the item's tooltip with the new lore line (&a+ %upgrade%)
  const ty = by + bh + 28, th = 132;
  rrPath(ctx, bx, ty, bw, th, 18); ctx.fillStyle = '#100010'; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = '#2a0a5e'; rrPath(ctx, bx + 6, ty + 6, bw - 12, th - 12, 14); ctx.stroke();
  ctx.font = '600 32px Geist'; ctx.fillStyle = MC.w; ctx.fillText('Железный меч', bx + 30, ty + 44);
  ctx.fillStyle = MC.a; ctx.fillText(`+ ${BUY.name}`, bx + 30, ty + 92);
  ctx.restore();
}

DESK.update = async (t) => {
  const ctx = deskCanvas.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);
  if (t < B(49)) return {};                                   // the held beat of black
  await footageAt(t - B(49) + 0.2);
  const Q = QUAD, k = W / Q.size;
  const Z = FOOTAGE.zoom + FOOTAGE.push * tw(t, B(49), B(53), (u) => u);
  // draw the footage so the phone screen sits at the centre of the square
  ctx.save();
  ctx.translate(CX, CY); ctx.scale(k * Z, k * Z); ctx.translate(-Q.cx, -Q.cy);
  ctx.drawImage(deskVideo, 0, 0, Q.vw || Q.size, Q.vh || Q.size);   // footage pixels; any aspect
  ctx.restore();
  // the black shape: full frame → the screen (beat 49) → full frame again (beat 52)
  const sw = Q.w * k * Z, sh = Q.h * k * Z, sr = Q.r * k * Z;
  const full = Math.hypot(W, H) + 40;
  const inS = track(t, 0, [[B(49), 1, 0.5, 0.86]]);
  const outS = tw(t, B(52), B(52) + 0.3, eio);
  const u = clamp(inS) * (1 - outS);
  const w = lerp(full, sw, u), h = lerp(full, sh, u), r = lerp(0, sr, u), ang = lerp(0, Q.angle, u);
  ctx.save();
  ctx.translate(CX, CY); ctx.rotate(ang);
  rrPath(ctx, -w / 2, -h / 2, w, h, r); ctx.clip();
  ctx.fillStyle = INK; ctx.fillRect(-w / 2, -h / 2, w, h);
  // iris opens onto the message (beat 50) and closes again (beat 51)
  const open = tw(t, B(50), B(50) + 0.3, eo) * (1 - tw(t, B(51), B(51) + 0.3, eio));
  if (open > 0.001) drawMessage(ctx, sw, sh);
  const R = Math.hypot(w, h) / 2 + 6;                         // blades always reach past the shape's corners
  const rot = 0.95 * open + 0.9 * tw(t, B(51), B(51) + 0.3, eio);
  // blades are ink-black; their seams draw in as the shape lands and thin out as it fills the frame
  const shade = Math.round(14 * u), seam = Math.round(11 + 30 * u);
  if (open < 0.999) drawIris(ctx, 0, 0, R, open * R * 1.02, rot, [INK, `rgb(${11 + shade * 0.25},${11 + shade * 0.25},${12 + shade * 0.3})`], `rgb(${seam},${seam},${seam + 3})`, 2.5 * u);
  ctx.restore();
  return {};
};
</script>

<script>
'use strict';
// ═════════════════════════════ RUNTIME ═════════════════════════════
let READY = null;
async function init() {
  if (READY) return READY;
  READY = (async () => {
    await Promise.all([
      document.fonts.load(`800 100px Archivo`), document.fonts.load(`600 100px Geist`), document.fonts.load(`800 100px Geist`),
      document.fonts.load(`600 100px Geist`, 'Кузнец'), document.fonts.load(`800 100px Geist`, 'Вампиризм'),
      document.fonts.load(`500 100px Geist Mono`),
    ]);
    await document.fonts.ready;
    await Promise.all([...Object.keys(UPGRADES), 'anvil'].map((k) => loadImage(k, `assets/covers/${k}.jpg`)));
    await loadImage('wall', `assets/covers/${COVER2}-wall.jpg`);
    await Promise.all([...document.images].map((i) => (i.complete ? null : new Promise((r) => { i.onload = i.onerror = r; }))));
    measureWordmark();
    for (const a of ACTS) if (a.init) await a.init();
  })();
  return READY;
}

// The whole film is a pure function of t.
async function seek(t) {
  await init();
  t = clamp(t, 0, DUR);
  let cursor = null;
  for (const a of ACTS) {
    const active = t >= a.t0 && (t < a.t1 || (a.t1 >= DUR && t <= DUR)) || (a.also && a.also(t));
    a.root.style.visibility = active ? 'visible' : 'hidden';
    if (active) {
      const r = (await a.update(t)) || {};
      if (r.cursor) cursor = r.cursor;
    }
  }
  drawCursor(cursor);
  // let images/filters settle before a capture
  await new Promise((r) => requestAnimationFrame(() => r()));
  return t;
}
window.seek = seek;
window.DUR = DUR;
window.BEAT = BEAT;

// Preview mode (open the file in a browser): fit to window, scrub and play.
if (!navigator.webdriver) {
  document.body.classList.add('preview');
  const frame = document.getElementById('frame');
  const fit = () => { const s = Math.min(innerWidth / W, (innerHeight - 48) / H); frame.style.transform = `scale(${s})`; frame.style.width = frame.style.height = `${1440 * s}px`; frame.style.transformOrigin = '0 0'; };
  addEventListener('resize', fit); fit();
  const scrub = document.getElementById('scrub'), tc = document.getElementById('tc'), playBtn = document.getElementById('play');
  let playing = false, t0 = 0, start = 0, busy = false;
  const go = async (t) => { if (busy) return; busy = true; await seek(t); tc.textContent = t.toFixed(3); scrub.value = t; busy = false; };
  scrub.oninput = () => go(+scrub.value);
  playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? '❚❚' : '▶'; t0 = +scrub.value; start = performance.now(); if (playing) loop(); };
  const loop = async () => { if (!playing) return; const t = (t0 + (performance.now() - start) / 1000) % DUR; await go(t); requestAnimationFrame(loop); };
  const q = new URLSearchParams(location.search);
  go(+(q.get('t') || 0));
}
</script>
